# Browser checks for the interactive pages under /tools/.
# Serves this repository on localhost and drives Playwright's own Chromium.
# ubuntu-latest only. No secrets, no paid runners, and no requests to Gumroad,
# Brevo, or other third parties. GoatCounter is stubbed inside the test.
# actions: write is only for the Playwright browser cache.

name: Tool page end-to-end

on:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: tools-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the checker
        run: npm ci

      - name: Install Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Run tool page tests
        run: npm run test:e2e
