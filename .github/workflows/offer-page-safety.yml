# Free check for the three live offer pages.
# Serves this repository on localhost and drives Playwright's own Chromium.
# No secrets, no paid services, and no requests to Gumroad, Brevo, or other third parties.

name: Offer page safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: offer-page-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the checker
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check offer pages
        env:
          OFFER_SCREENSHOT_DIR: offer-page-screenshots
        run: node --test --test-concurrency=1 tests/offer-page-safety.test.mjs

      - name: Upload 390px screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offer-pages-390px
          path: offer-page-screenshots/
          if-no-files-found: error
