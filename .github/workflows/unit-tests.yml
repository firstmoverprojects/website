# Full static test suite: every tests/*.test.mjs (not tests/e2e).
# Serves offer pages on localhost for Playwright; blocks third-party network.
# No secrets, no paid runners, no live requests to Gumroad, GoatCounter, or Brevo.

name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Run unit tests
        env:
          PLAYWRIGHT_CORE: playwright
          OFFER_SCREENSHOT_DIR: offer-page-screenshots
        run: npm run test:unit

      - name: Upload 390px offer screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-tests-390px-offer-pages
          path: offer-page-screenshots/
          if-no-files-found: warn
